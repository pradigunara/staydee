name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Fetch FFmpegKit AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/fetch-aar.sh
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.STAYDEE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STAYDEE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Test and assemble
        env:
          STAYDEE_KEYSTORE_PASSWORD: ${{ secrets.STAYDEE_KEYSTORE_PASSWORD }}
          STAYDEE_KEY_ALIAS: ${{ secrets.STAYDEE_KEY_ALIAS }}
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: staydee-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v5
        with:
          name: staydee-release-apk
          path: app/build/outputs/apk/release/*.apk

  # tag pushes (v*) publish the signed APK as a GitHub release: the sideload channel (plan §15)
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: staydee-release-apk
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="staydee-${GITHUB_REF_NAME}.apk"
          mv app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --repo "$GITHUB_REPOSITORY" --title "Staydee $GITHUB_REF_NAME" --generate-notes
